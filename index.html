<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Prime Global | Opportunities Worldwide</title>
  <meta name="description" content="Prime Global connects people with information about digital work and global remote opportunities.">

  <style>
    :root {
      --navy: #071a3d;
      --navy-light: #102a56;
      --blue: #1d4ed8;
      --gold: #f5c542;
      --white: #ffffff;
      --light: #f8fafc;
      --text: #172033;
      --muted: #64748b;
      --border: #e2e8f0;
      --green: #10b981;
      --red: #dc2626;
      --shadow: 0 8px 25px rgba(7, 26, 61, 0.10);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--light);
      color: var(--text);
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      width: min(1120px, 92%);
      margin: auto;
    }

    /* ================= HEADER ================= */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: var(--navy);
      color: var(--white);
      box-shadow: 0 3px 15px rgba(0,0,0,0.15);
    }

    .nav-container {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .logo {
      width: 44px;
      height: 44px;
      border: 2px solid var(--gold);
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: var(--gold);
      font-weight: 900;
      font-size: 20px;
      flex-shrink: 0;
    }

    .brand-text {
      line-height: 1.15;
    }

    .brand-name {
      font-size: 19px;
      font-weight: 800;
    }

    .brand-tagline {
      color: #dbe4f2;
      font-size: 11px;
      margin-top: 3px;
    }

    .desktop-nav {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .desktop-nav a {
      padding: 9px 10px;
      border-radius: 8px;
      font-size: 14px;
      transition: 0.2s;
    }

    .desktop-nav a:hover {
      background: rgba(245,197,66,0.14);
      color: var(--gold);
    }

    .nav-buttons {
      display: flex;
      gap: 8px;
      margin-left: 8px;
    }

    .btn-small {
      border: 1px solid var(--gold);
      background: var(--gold);
      color: var(--navy);
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
    }

    .btn-small.secondary {
      background: transparent;
      color: var(--white);
    }

    .menu-btn {
      display: none;
      border: 1px solid rgba(255,255,255,0.3);
      background: transparent;
      color: white;
      width: 44px;
      height: 44px;
      border-radius: 9px;
      font-size: 23px;
    }

    .mobile-menu {
      display: none;
      background: var(--navy-light);
      border-top: 1px solid rgba(255,255,255,0.12);
      padding: 10px 4%;
    }

    .mobile-menu.open {
      display: block;
    }

    .mobile-menu a,
    .mobile-menu button {
      width: 100%;
      display: block;
      text-align: left;
      padding: 12px;
      color: white;
      background: transparent;
      border: none;
      border-radius: 8px;
    }

    .mobile-menu a:hover,
    .mobile-menu button:hover {
      background: rgba(245,197,66,0.12);
      color: var(--gold);
    }

    /* ================= HERO ================= */

    .hero {
      background:
        linear-gradient(135deg, rgba(7,26,61,0.97), rgba(16,42,86,0.94));
      color: white;
      padding: 85px 0 75px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.3fr 0.7fr;
      gap: 45px;
      align-items: center;
    }

    .hero h1 {
      font-size: clamp(35px, 6vw, 62px);
      line-height: 1.05;
      margin-bottom: 20px;
    }

    .hero h1 span {
      color: var(--gold);
    }

    .hero p {
      color: #dbe4f2;
      font-size: 18px;
      max-width: 680px;
      margin-bottom: 28px;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 11px 18px;
      border-radius: 10px;
      border: 1px solid transparent;
      font-weight: 700;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 18px rgba(0,0,0,0.12);
    }

    .btn-primary {
      background: var(--gold);
      color: var(--navy);
    }

    .btn-outline {
      background: transparent;
      border-color: rgba(255,255,255,0.5);
      color: white;
    }

    .hero-card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 28px;
    }

    .hero-card h3 {
      color: var(--gold);
      margin-bottom: 14px;
    }

    .hero-card li {
      list-style: none;
      margin: 12px 0;
      color: #e4ebf5;
    }

    .hero-card li::before {
      content: "✓";
      color: var(--gold);
      font-weight: bold;
      margin-right: 10px;
    }

    /* ================= STATS ================= */

    .stats {
      margin-top: -28px;
      position: relative;
      z-index: 5;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .stat {
      background: white;
      border-radius: 14px;
      padding: 22px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .stat strong {
      display: block;
      color: var(--navy);
      font-size: 26px;
    }

    .stat span {
      color: var(--muted);
      font-size: 13px;
    }

    /* ================= SECTIONS ================= */

    section {
      padding: 80px 0;
    }

    .section-heading {
      text-align: center;
      max-width: 720px;
      margin: 0 auto 40px;
    }

    .section-heading h2 {
      color: var(--navy);
      font-size: clamp(27px, 4vw, 38px);
      margin-bottom: 10px;
    }

    .section-heading p {
      color: var(--muted);
    }

    .gold-line {
      width: 55px;
      height: 4px;
      background: var(--gold);
      border-radius: 10px;
      margin: 12px auto;
    }

    /* ================= ABOUT ================= */

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
    }

    .info-card {
      background: white;
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .info-card h3 {
      color: var(--navy);
      margin-bottom: 12px;
    }

      color: var
