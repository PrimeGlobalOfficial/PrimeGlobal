<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Prime Global | Worldwide Online Opportunities</title>

  <meta
    name="description"
    content="Prime Global connects people worldwide with online, remote and digital work opportunities."
  >

  <meta name="theme-color" content="#0b1735">

  <style>
    :root {
      --navy: #0b1735;
      --navy2: #132653;
      --dark: #060d20;
      --gold: #d4af37;
      --gold2: #f2d675;
      --white: #ffffff;
      --light: #f5f7fb;
      --text: #172033;
      --muted: #667085;
      --border: #dfe4ec;
      --blue: #1d4ed8;
      --green: #10b981;
      --red: #dc2626;
      --shadow: 0 8px 25px rgba(11,23,53,.10);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 80px;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--light);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
    }

    body.modal-open {
      overflow: hidden;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    /* ==============================
       HEADER
    ============================== */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: var(--navy);
      border-bottom: 2px solid var(--gold);
      box-shadow: 0 3px 15px rgba(0,0,0,.18);
    }

    .nav-container {
      width: min(1200px, 94%);
      min-height: 70px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
      color: white;
      font-weight: 800;
      font-size: 1.3rem;
      white-space: nowrap;
    }

    .logo-mark {
      width: 42px;
      height: 42px;
      border: 2px solid var(--gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
      font-weight: 900;
    }

    .logo span {
      color: var(--gold);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .nav-links a {
      color: white;
      padding: 9px 11px;
      border-radius: 8px;
      font-weight: 600;
      transition: .2s;
    }

    .nav-links a:hover,
    .nav-links a:focus {
      background: rgba(212,175,55,.16);
      color: var(--gold2);
    }

    .nav-auth {
      display: flex;
      gap: 7px;
    }

    .menu-btn {
      display: none;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255,255,255,.5);
      border-radius: 8px;
      background: transparent;
      color: white;
      cursor: pointer;
      font-size: 22px;
    }

    /* ==============================
       BUTTONS
    ============================== */

    .btn {
      border: none;
      border-radius: 9px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: .2s;
      min-height: 44px;
      -webkit-appearance: none;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn:active {
      transform: scale(.98);
    }

    .btn-primary {
      background: var(--gold);
      color: var(--navy);
    }

    .btn-primary:hover {
      background: var(--gold2);
    }

    .btn-secondary {
      background: var(--navy);
      color: white;
    }

    .btn-outline {
      background: transparent;
      color: var(--gold);
      border: 1px solid var(--gold);
    }

    .btn-danger {
      background: var(--red);
      color: white;
    }

    /* ==============================
       HERO
    ============================== */

    .hero {
      background: linear-gradient(
        135deg,
        var(--navy),
        var(--navy2)
      );
      color: white;
      text-align: center;
      padding: 85px 20px;
    }

    .hero-inner {
      width: min(1000px, 94%);
      margin: auto;
    }

    .hero h1 {
      font-size: clamp(2.1rem, 6vw, 4rem);
      line-height: 1.1;
      margin-bottom: 20px;
    }

    .hero h1 span {
      color: var(--gold);
    }

    .hero p {
      max-width: 760px;
      margin: auto;
      color: #e5e9f2;
      font-size: clamp(1rem, 2vw, 1.2rem);
    }

    .hero-actions {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    /* ==============================
       SECTIONS
    ============================== */

    section {
      padding: 70px 20px;
    }

    .section-container {
      width: min(1200px, 94%);
      margin: auto;
    }

    .section-heading {
      text-align: center;
      margin-bottom: 38px;
    }

    .section-heading h2 {
      color: var(--navy);
      font-size: clamp(1.7rem, 4vw, 2.5rem);
      margin-bottom: 8px;
    }

    .section-heading p {
      max-width: 720px;
      margin: auto;
      color: var(--muted);
    }

    /* ==============================
       STATS
    ============================== */

    .stats {
      background: white;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .stat {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      text-align: center;
      padding: 24px 12px;
    }

    .stat strong {
      display: block;
      color: var(--navy);
      font-size: 1.8rem;
      margin-bottom: 4px;
    }

    .stat span {
      color: var(--muted);
    }

    /* ==============================
       OPPORTUNITIES
    ============================== */

    #opportunities {
      background: var(--light);
    }

    .filters {
      display: flex;
      justify-content: center;
      margin-bottom: 18px;
    }

    .search-box {
      width: min(600px, 100%);
    }

    .search-box input {
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 15px;
      outline: none;
      background: white;
    }

    .search-box input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(212,175,55,.15);
    }

    .filter-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 30px;
    }

    .filter-btn {
      min-height: 42px;
      padding: 8px 13px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: white;
      color: var(--navy);
      cursor: pointer;
      font-weight: 600;
    }

    .filter-btn.active,
    .filter-btn:hover {
      background: var(--navy);
      color: white;
      border-color: var(--navy);
    }

    .opportunity-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }

    .opportunity-card {
      min-width: 0;
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      height: 100%;
      transition: .2s;
    }

    .opportunity-card:hover {
      transform: translateY(-3px);
      border-color: var(--gold);
    }

    .opportunity-icon {
      width: 50px;
      height: 50px;
      background: var(--navy);
      color: var(--gold);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      margin-bottom: 15px;
    }

    .opportunity-card h3 {
      color: var(--navy);
      margin-bottom: 9px;
    }

    .opportunity-card p {
      color: var(--muted);
      margin-bottom: 15px;
      flex: 1;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 17px;
    }

    .tag {
      background: #eef2ff;
      color: var(--navy);
      border-radius: 20px;
      padding: 4px 8px;
      font-size: .76rem;
      font-weight: 700;
    }

    .opportunity-card .btn {
      width: 100%;
    }

    .no-results {
      display: none;
      grid-column: 1 / -1;
      text-align: center;
      padding: 30px;
      color: var(--muted);
    }

    /* ==============================
       WORK
    ============================== */

    #work {
      background: white;
    }

    .work-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 20px;
    }

    .work-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      text-align: center;
      padding: 25px 20px;
      min-width: 0;
    }

    .step-number {
      width: 50px;
      height: 50px;
      margin: 0 auto 15px;
      background: var(--navy);
      color: var(--gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: 800;
    }

    .work-card h3 {
      color: var(--navy);
      margin-bottom: 8px;
    }

    .work-card p {
      color: var(--muted);
    }

    /* ==============================
       REQUIREMENTS
    ============================== */

    #requirements {
      background: var(--light);
    }

    .requirements-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .requirement-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 25px;
    }

    .requirement-card h3 {
      color: var(--navy);
      margin-bottom: 12px;
    }

    .requirement-card ul {
      padding-left: 20px;
      color: var(--muted);
    }

    .requirement-card li {
      margin-bottom: 7px;
    }

    /* ==============================
       MEMBERS
    ============================== */

    #members {
      background: white;
    }

    .auth-panel {
      width: min(520px, 100%);
      margin: auto;
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px;
    }

    .auth-panel h3 {
      color: var(--navy);
      text-align: center;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      color: var(--navy);
      font-weight: 700;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      min-height: 46px;
      padding: 11px 13px;
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--gold);
    }

    .auth-actions {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
    }

    .auth-actions .btn {
      flex: 1;
    }

    .auth-message {
      display: none;
      margin-top: 15px;
      padding: 11px;
      border-radius: 8px;
      font-size: .9rem;
    }

    .auth-message.success {
      display: block;
      background: #ecfdf5;
      color: #047857;
    }

    .auth-message.error {
      display: block;
      background: #fef2f2;
      color: #b91c1c;
    }

    .member-content {
      display: none;
    }

    .member-content.visible {
      display: block;
    }

    .member-header {
      background: var(--navy);
      color: white;
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .member-header h3 {
      color: var(--gold);
    }

    .profile-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 25px;
    }

    .admin-panel {
      display: none;
      margin-top: 20px;
      border: 2px solid var(--gold);
      border-radius: var(--radius);
      padding: 25px;
      background: #fffdf5;
    }

    .admin-panel.visible {
      display: block;
    }

    /* ==============================
       CONTACT
    ============================== */

    #contact {
      background: var(--navy);
      color: white;
    }

    #contact .section-heading h2 {
      color: white;
    }

    #contact .section-heading p {
      color: #dce2ef;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .contact-card {
      min-width: 0;
      text-align: center;
      padding: 25px 15px;
      border: 1px solid rgba(212,175,55,.35);
      border-radius: var(--radius);
      background: rgba(255,255,255,.04);
    }

    .contact-icon {
      color: var(--gold);
      font-size: 1.7rem;
      margin-bottom: 8px;
    }

    .contact-card h3 {
      color: var(--gold);
      margin-bottom: 7px;
    }

    .contact-card a,
    .contact-card p {
      color: #e6eaf2;
      overflow-wrap: anywhere;
    }

    .contact-card a:hover {
      color: var(--gold2);
    }

    /* ==============================
       FOOTER
    ============================== */

    footer {
      background: var(--dark);
      color: #cfd6e4;
      text-align: center;
      padding: 35px 20px;
    }

    .footer-brand {
      color: var(--gold);
      font-size: 1.3rem;
      font-weight: 800;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
      margin: 15px 0;
    }

    .footer-links a:hover {
      color: var(--gold);
    }

    .footer-social a {
      color: var(--gold);
      font-weight: 700;
    }

    /* ==============================
