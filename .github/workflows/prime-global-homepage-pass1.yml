name: Prime Global Homepage Pass 1
on:
  push:
    paths:
      - homepage-pass1.trigger
  workflow_dispatch:
permissions:
  contents: write
jobs:
  enhance-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply homepage pass
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); h=p.read_text(encoding='utf-8')
          if 'id="pg-growth-pass-1"' in h: raise SystemExit(0)
          css='''
          .pg-trust-strip{max-width:1200px;margin:0 auto;padding:0 20px;transform:translateY(-24px);position:relative;z-index:5}.pg-trust-inner{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:#fff;border:1px solid #dbe6f4;border-radius:16px;padding:12px;box-shadow:0 16px 35px #173b7814}.pg-trust-item{min-height:58px;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;background:#f7faff}.pg-trust-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#eaf1ff;color:#246bfd;font-weight:900}.pg-trust-item strong{display:block;color:#173b78;font-size:13px}.pg-trust-item span{display:block;color:#62718a;font-size:11px}.pg-cta-panel{background:linear-gradient(135deg,#101c3a,#173b78 62%,#155e75);color:#fff;border-radius:20px;padding:30px;display:grid;grid-template-columns:1.5fr .5fr;gap:24px;align-items:center;box-shadow:0 18px 45px #173b7820}.pg-cta-panel h3{margin:0 0 7px;font-size:27px}.pg-cta-panel p{margin:0;color:#dbe8fb}.pg-cta-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}.pg-cta-actions .btn{white-space:nowrap}.pg-disclaimer{margin-top:13px;color:#c8d5e8;font-size:12px}@media(max-width:950px){.pg-trust-inner{grid-template-columns:repeat(2,1fr)}.pg-cta-panel{grid-template-columns:1fr}.pg-cta-actions{justify-content:flex-start}}@media(max-width:700px){.pg-trust-inner{grid-template-columns:1fr}.pg-cta-panel{padding:22px}.pg-cta-panel h3{font-size:23px}}
          '''
          h=h.replace('</style>',css+'</style>',1)
          a='</section>\n\n\n<main>'
          b='''</section>\n<div class="pg-trust-strip" id="pg-growth-pass-1"><div class="pg-trust-inner"><div class="pg-trust-item"><div class="pg-trust-icon">✓</div><div><strong>Official routes</strong><span>Follow employer links</span></div></div><div class="pg-trust-item"><div class="pg-trust-icon">◎</div><div><strong>Clear requirements</strong><span>Know what to check</span></div></div><div class="pg-trust-item"><div class="pg-trust-icon">$</div><div><strong>Payment awareness</strong><span>Verify payout rules</span></div></div><div class="pg-trust-item"><div class="pg-trust-icon">◈</div><div><strong>Safety first</strong><span>Never pay for a job</span></div></div></div></div>\n<main>'''
          if a not in h: raise SystemExit('Hero boundary not found')
          h=h.replace(a,b,1)
          a='</section>\n\n\n<!-- PUBLIC START WORKING HUB -->'
          b='''</section>\n<section aria-label="Prime Global next step"><div class="pg-cta-panel"><div><h3>Ready to explore your next opportunity?</h3><p>Start with the opportunity guides, then check the official application route and requirements.</p><div class="pg-disclaimer">Prime Global does not guarantee hiring, income, acceptance, or third-party payment.</div></div><div class="pg-cta-actions"><a class="btn primary" href="#opportunities">Explore opportunities →</a><a class="btn secondary" href="faq.html">Read FAQ →</a></div></div></section>\n<!-- PUBLIC START WORKING HUB -->'''
          if a not in h: raise SystemExit('Opportunities boundary not found')
          h=h.replace(a,b,1)
          p.write_text(h,encoding='utf-8')
          PY
      - name: Commit homepage update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Improve homepage conversion and trust presentation"
          git push
